name = "peach-blossom-spring-memory"
main = "src/index.ts"
compatibility_date = "2026-05-31"
workers_dev = true

[vars]
DEEPSEEK_PROXY_URL = "https://pbs-deepseek-proxy.dontmarryme.workers.dev/chat"
DEEPSEEK_ORIGIN = "https://weiweiweiopen.github.io"
PBS_ALLOWED_ORIGINS = "https://weiweiweiopen.github.io,http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173,http://127.0.0.1:5173"

[[services]]
binding = "DEEPSEEK_PROXY"
service = "pbs-deepseek-proxy"

[[d1_databases]]
binding = "DB"
database_name = "peach-blossom-spring-memory-db"
database_id = "b0213a5d-720e-4311-871f-a6413a2e91b4"
